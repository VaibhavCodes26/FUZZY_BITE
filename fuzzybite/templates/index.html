<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuzzyBite | Soft Computing Recommender</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>FuzzyBite</h1>
        <p>Restaurant Recommendation System Using Mamdani Fuzzy Logic</p>
    </header>
    <main class="container">
        <section class="form-section">
            <h2>User Preferences</h2>
            <form id="recommendation-form" onsubmit="event.preventDefault(); computeResults();">
                <div class="form-group">
                    <label for="budget">Budget per person (₹):</label>
                    <input type="number" id="budget" required min="100" value="500">
                </div>
                <div class="form-group">
                    <label for="max_distance">Maximum Distance (km):</label>
                    <input type="number" id="max_distance" required min="1" value="5" step="0.5">
                </div>
                <div class="form-group">
                    <label for="cuisine">Preferred Cuisine:</label>
                    <input type="text" id="cuisine" value="Any">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="req_veg">
                    <label for="req_veg">Strictly Vegetarian Only (Hard Constraint)</label>
                </div>
                <button type="submit" id="submit-btn">Compute Recommendations</button>
            </form>
        </section>
        <section class="results-section">
            <h2>Recommendations</h2>
            <div id="results-summary">
                <p>Fill out your preferences and click compute.</p>
            </div>
            <div id="results-container"></div>
        </section>
    </main>

    <script>
        async function computeResults() {
            const btn = document.getElementById('submit-btn');
            const summary = document.getElementById('results-summary');
            const container = document.getElementById('results-container');
            
            btn.disabled = true;
            btn.textContent = "Computing Mamdani Inference...";
            container.innerHTML = '';
            summary.innerHTML = '<p>Processing fuzzy logic rules...</p>';

            const prefs = {
                budget: parseFloat(document.getElementById('budget').value),
                max_distance: parseFloat(document.getElementById('max_distance').value),
                cuisine: document.getElementById('cuisine').value,
                req_veg: document.getElementById('req_veg').checked
            };

            try {
                const response = await fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(prefs)
                });
                
                const data = await response.json();
                summary.innerHTML = `<p><strong>${data.count}</strong> restaurants met your constraints.</p>`;
                
                data.results.forEach((r, i) => {
                    const inputs = r.inference_details.inputs;
                    container.innerHTML += `
                        <div class="result-card">
                            <div class="result-header">
                                <h3>#${i + 1}. ${r.name}</h3>
                                <div class="fuzzy-score-badge">Score: ${r.fuzzy_score.toFixed(2)}</div>
                            </div>
                            <div class="inference-details">
                                <p><strong>Status:</strong> ${r.inference_details.status}</p>
                                <table class="fuzzy-table">
                                    <tr><th>Rating</th><th>Price Suit.</th><th>Distance</th><th>Cuisine Match</th></tr>
                                    <tr>
                                        <td>${inputs.rating.toFixed(2)}</td>
                                        <td>${inputs.price_suitability.toFixed(2)}</td>
                                        <td>${inputs.distance.toFixed(2)}</td>
                                        <td>${inputs.cuisine_match.toFixed(2)}</td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                summary.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "Compute Recommendations";
            }
        }
    </script>
</body>
</html>
